<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{calificacion.formTitulo}">Nueva Calificación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<div class="container-lg mt-4">

    <h1 th:text="#{calificacion.formTitulo}">Nueva Calificación</h1>

    <p th:if="${#lists.isEmpty(sesionesRealizadas)}" class="alert alert-warning" th:text="#{calificacion.sinSesionesRealizadas}">
        No hay sesiones realizadas disponibles para calificar todavía.
    </p>

    <form th:unless="${#lists.isEmpty(sesionesRealizadas)}"
          th:action="@{/calificaciones/guardar}" method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label" th:text="#{calificacion.sesionRealizada}">Sesión realizada</label>
            <select name="idSesion" class="form-select" required>
                <option value="" th:text="#{accion.seleccione}">-- Seleccione --</option>
                <option th:each="s : ${sesionesRealizadas}"
                        th:value="${s.idSesion}"
                        th:text="${s.solicitud.estudiante.usuario.nombre} + ' - ' + ${s.solicitud.tutor.usuario.nombre} + ' - ' + ${s.solicitud.asignatura.nombre} + ' (' + ${s.fechaHora} + ')'">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{calificacion.puntuacionLabel}">Puntuación (1 a 5)</label>
            <input type="number" name="puntuacion" class="form-control" min="1" max="5" required>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{calificacion.comentario}">Comentario</label>
            <textarea name="comentario" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
        <a th:href="@{/calificaciones}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>

    </form>

</div>

</body>
</html>
