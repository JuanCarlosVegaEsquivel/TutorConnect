<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{calificacion.listado}">Listado de Calificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{calificacion.listado}">Listado de Calificaciones</h1>
        <a sec:authorize="hasAnyRole('ESTUDIANTE','ADMIN')"
           th:href="@{/calificaciones/nuevo}" class="btn btn-primary" th:text="#{calificacion.nuevo}">Nueva calificación</a>
    </div>

    <table class="table mt-3">
        <thead>
            <tr>
                <th th:text="#{calificacion.estudiante}">Estudiante</th>
                <th th:text="#{calificacion.tutor}">Tutor</th>
                <th th:text="#{calificacion.asignatura}">Asignatura</th>
                <th th:text="#{calificacion.puntuacion}">Puntuación</th>
                <th th:text="#{calificacion.comentario}">Comentario</th>
                <th th:text="#{calificacion.fecha}">Fecha</th>
                <th sec:authorize="hasRole('ADMIN')" th:text="#{calificacion.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${calificaciones}">
                <td th:text="${c.sesion.solicitud.estudiante.usuario.nombre}"></td>
                <td th:text="${c.sesion.solicitud.tutor.usuario.nombre}"></td>
                <td th:text="${c.sesion.solicitud.asignatura.nombre}"></td>
                <td th:text="${c.puntuacion} + ' / 5'"></td>
                <td th:text="${c.comentario}"></td>
                <td th:text="${c.fecha}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/calificaciones/eliminar/{id}(id=${c.idCalificacion})}"
                       class="btn btn-sm btn-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{calificacion.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
