<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{estudiante.listado}">Listado de Estudiantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{estudiante.listado}">Listado de Estudiantes</h1>
        <a th:href="@{/estudiantes/nuevo}" class="btn btn-primary" th:text="#{estudiante.nuevo}">Nuevo estudiante</a>
    </div>

    <div class="alert alert-primary" role="alert">
        <span th:text="#{estudiante.total}">Total de estudiantes</span>:
        <span th:text="${totalEstudiantes}"></span>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th th:text="#{estudiante.nombre}">Nombre</th>
                <th th:text="#{estudiante.correo}">Correo</th>
                <th th:text="#{estudiante.carrera}">Carrera</th>
                <th th:text="#{estudiante.telefono}">Teléfono</th>
                <th th:text="#{estudiante.materiasInteres}">Materias de interés</th>
                <th th:text="#{estudiante.activo}">Activo</th>
                <th th:text="#{estudiante.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="estudiante : ${estudiantes}">
                <td th:text="${estudiante.usuario.nombre}"></td>
                <td th:text="${estudiante.usuario.correo}"></td>
                <td th:text="${estudiante.carrera}"></td>
                <td th:text="${estudiante.telefono}"></td>
                <td>
                    <span class="badge bg-secondary me-1"
                          th:each="asignatura : ${estudiante.asignaturasInteres}"
                          th:text="${asignatura.nombre}"></span>
                </td>
                <td th:text="${estudiante.activo} ? #{texto.si} : #{texto.no}"></td>
                <td>
                    <a th:href="@{/estudiantes/editar/{id}(id=${estudiante.idUsuario})}" class="btn btn-sm btn-outline-primary" th:text="#{accion.editar}">Editar</a>
                    <a th:href="@{/estudiantes/eliminar/{id}(id=${estudiante.idUsuario})}" class="btn btn-sm btn-outline-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{estudiante.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
