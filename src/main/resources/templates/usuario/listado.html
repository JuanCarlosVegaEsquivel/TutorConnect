<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{usuario.listado}">Listado de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <h1 th:text="#{usuario.listado}">Listado de Usuarios</h1>

    <div class="alert alert-primary" role="alert">
        <span th:text="#{usuario.total}">Total de usuarios</span>:
        <span th:text="${totalUsuarios}"></span>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th th:text="#{usuario.nombre}">Nombre</th>
                <th th:text="#{usuario.correo}">Correo</th>
                <th th:text="#{usuario.activo}">Activo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.activo} ? #{texto.si} : #{texto.no}"></td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
