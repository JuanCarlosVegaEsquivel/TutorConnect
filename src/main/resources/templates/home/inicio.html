<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi panel - TutorConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">TutorConnect</span>
    <form th:action="@{/logout}" method="post" class="d-flex">
        <button class="btn btn-sm btn-outline-light" type="submit">Cerrar sesión</button>
    </form>
</nav>

<div class="container py-4">
    <h3>Hola, <span th:text="${usuario.nombre}">Nombre</span></h3>
    <p class="text-secondary">
        Rol: <span class="badge bg-secondary" th:text="${usuario.rol.etiqueta}">Rol</span>
    </p>

    <div sec:authorize="hasRole('ADMIN')" class="row g-3 mt-2">
        <div class="col-md-3"><a th:href="@{/usuario/listado}" class="btn btn-outline-dark w-100">Usuarios</a></div>
        <div class="col-md-3"><a th:href="@{/asignaturas}" class="btn btn-outline-dark w-100">Asignaturas</a></div>
        <div class="col-md-3"><a th:href="@{/tutores}" class="btn btn-outline-dark w-100">Tutores</a></div>
        <div class="col-md-3"><a th:href="@{/estudiantes}" class="btn btn-outline-dark w-100">Estudiantes</a></div>
    </div>

    <div sec:authorize="hasRole('TUTOR')" class="row g-3 mt-2">
        <div class="col-md-4"><a th:href="@{/horarios}" class="btn btn-outline-dark w-100">Mis horarios</a></div>
        <div class="col-md-4"><a th:href="@{/solicitudes}" class="btn btn-outline-dark w-100">Solicitudes recibidas</a></div>
        <div class="col-md-4"><a th:href="@{/sesiones}" class="btn btn-outline-dark w-100">Sesiones</a></div>
    </div>

    <div sec:authorize="hasRole('ESTUDIANTE')" class="row g-3 mt-2">
        <div class="col-md-4"><a th:href="@{/tutores}" class="btn btn-outline-dark w-100">Buscar tutor</a></div>
        <div class="col-md-4"><a th:href="@{/solicitudes/nuevo}" class="btn btn-outline-dark w-100">Solicitar tutoría</a></div>
        <div class="col-md-4"><a th:href="@{/solicitudes}" class="btn btn-outline-dark w-100">Mis solicitudes</a></div>
    </div>
</div>
</body>
</html>
