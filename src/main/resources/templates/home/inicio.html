<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{app.nombre}">Mi panel - TutorConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{''(lang=es)}" class="text-light me-2 small">ES</a>
        <a th:href="@{''(lang=en)}" class="text-light me-2 small">EN</a>
        <a th:href="@{''(lang=fr)}" class="text-light me-2 small">FR</a>
        <a th:href="@{''(lang=pt)}" class="text-light me-3 small">PT</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.cerrarSesion}">Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <h3><span th:text="#{inicio.hola}">Hola</span>, <span th:text="${usuario.nombre}">Nombre</span></h3>
    <p class="text-secondary">
        <span th:text="#{inicio.rol}">Rol</span>:
        <span class="badge bg-secondary" th:text="${usuario.rol.etiqueta}">Rol</span>
    </p>

    <div sec:authorize="hasRole('ADMIN')" class="row g-3 mt-2">
        <div class="col-md-3"><a th:href="@{/usuario/listado}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuUsuarios}">Usuarios</a></div>
        <div class="col-md-3"><a th:href="@{/asignaturas}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuAsignaturas}">Asignaturas</a></div>
        <div class="col-md-3"><a th:href="@{/tutores}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuTutores}">Tutores</a></div>
        <div class="col-md-3"><a th:href="@{/estudiantes}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuEstudiantes}">Estudiantes</a></div>
    </div>

    <div sec:authorize="hasRole('TUTOR')" class="row g-3 mt-2">
        <div class="col-md-4"><a th:href="@{/horarios}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuMisHorarios}">Mis horarios</a></div>
        <div class="col-md-4"><a th:href="@{/solicitudes}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuSolicitudesRecibidas}">Solicitudes recibidas</a></div>
        <div class="col-md-4"><a th:href="@{/sesiones}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuSesiones}">Sesiones</a></div>
    </div>

    <div sec:authorize="hasRole('ESTUDIANTE')" class="row g-3 mt-2">
        <div class="col-md-4"><a th:href="@{/tutores}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuBuscarTutor}">Buscar tutor</a></div>
        <div class="col-md-4"><a th:href="@{/solicitudes/nuevo}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuSolicitarTutoria}">Solicitar tutoría</a></div>
        <div class="col-md-4"><a th:href="@{/solicitudes}" class="btn btn-outline-dark w-100" th:text="#{inicio.menuMisSolicitudes}">Mis solicitudes</a></div>
    </div>
</div>
</body>
</html>
