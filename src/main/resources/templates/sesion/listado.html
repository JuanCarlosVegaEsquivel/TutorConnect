<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{sesion.listado}">Listado de Sesiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{sesion.listado}">Listado de Sesiones</h1>
        <a th:href="@{/sesiones/nuevo}" class="btn btn-primary" th:text="#{sesion.nuevo}">Nueva sesión</a>
    </div>

    <table class="table mt-3">
        <thead>
            <tr>
                <th th:text="#{sesion.estudiante}">Estudiante</th>
                <th th:text="#{sesion.tutor}">Tutor</th>
                <th th:text="#{sesion.asignatura}">Asignatura</th>
                <th th:text="#{sesion.fechaHora}">Fecha/Hora</th>
                <th th:text="#{sesion.duracion}">Duración (min)</th>
                <th th:text="#{sesion.estado}">Estado</th>
                <th th:text="#{sesion.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${sesiones}">
                <td th:text="${s.solicitud.estudiante.usuario.nombre}"></td>
                <td th:text="${s.solicitud.tutor.usuario.nombre}"></td>
                <td th:text="${s.solicitud.asignatura.nombre}"></td>
                <td th:text="${s.fechaHora}"></td>
                <td th:text="${s.duracionMinutos}"></td>
                <td>
                    <span class="badge bg-primary" th:if="${s.estado.name() == 'PROGRAMADA'}" th:text="#{estado.programada}">Programada</span>
                    <span class="badge bg-success" th:if="${s.estado.name() == 'REALIZADA'}" th:text="#{estado.realizada}">Realizada</span>
                    <span class="badge bg-secondary" th:if="${s.estado.name() == 'CANCELADA'}" th:text="#{estado.cancelada}">Cancelada</span>
                </td>
                <td>
                    <a th:if="${s.estado.name() == 'PROGRAMADA'}"
                       th:href="@{/sesiones/realizada/{id}(id=${s.idSesion})}"
                       class="btn btn-sm btn-success" th:text="#{sesion.marcarRealizada}">Marcar realizada</a>
                    <a th:if="${s.estado.name() == 'PROGRAMADA'}"
                       th:href="@{/sesiones/cancelar/{id}(id=${s.idSesion})}"
                       class="btn btn-sm btn-warning" th:text="#{sesion.cancelar}">Cancelar</a>
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/sesiones/eliminar/{id}(id=${s.idSesion})}"
                       class="btn btn-sm btn-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{sesion.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
