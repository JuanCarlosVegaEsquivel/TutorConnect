<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Listado de Sesiones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1>Listado de Sesiones</h1>
        <a th:href="@{/sesiones/nuevo}" class="btn btn-primary">Nueva sesión</a>
    </div>

    <table class="table mt-3">

        <thead>
            <tr>
                <th>Estudiante</th>
                <th>Tutor</th>
                <th>Asignatura</th>
                <th>Fecha/Hora</th>
                <th>Duración (min)</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="s : ${sesiones}">
                <td th:text="${s.solicitud.estudiante.usuario.nombre}"></td>
                <td th:text="${s.solicitud.tutor.usuario.nombre}"></td>
                <td th:text="${s.solicitud.asignatura.nombre}"></td>
                <td th:text="${s.fechaHora}"></td>
                <td th:text="${s.duracionMinutos}"></td>
                <td>
                    <span class="badge bg-primary" th:if="${s.estado.name() == 'PROGRAMADA'}">Programada</span>
                    <span class="badge bg-success" th:if="${s.estado.name() == 'REALIZADA'}">Realizada</span>
                    <span class="badge bg-secondary" th:if="${s.estado.name() == 'CANCELADA'}">Cancelada</span>
                </td>
                <td>
                    <a th:if="${s.estado.name() == 'PROGRAMADA'}"
                       th:href="@{/sesiones/realizada/{id}(id=${s.idSesion})}"
                       class="btn btn-sm btn-success">Marcar realizada</a>
                    <a th:if="${s.estado.name() == 'PROGRAMADA'}"
                       th:href="@{/sesiones/cancelar/{id}(id=${s.idSesion})}"
                       class="btn btn-sm btn-warning">Cancelar</a>
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/sesiones/eliminar/{id}(id=${s.idSesion})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Eliminar esta sesión?');">Eliminar</a>
                </td>
            </tr>
        </tbody>

    </table>

</div>

</body>
</html>
