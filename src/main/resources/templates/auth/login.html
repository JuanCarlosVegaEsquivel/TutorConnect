<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - TutorConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3">Iniciar sesión</h4>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                Correo o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2">
                Cerraste sesión correctamente.
            </div>
            <div th:if="${exito}" class="alert alert-success py-2" th:text="${exito}"></div>

            <!-- action="/login" y los nombres correo/contrasena deben coincidir
                 exactamente con lo configurado en SecurityConfig.formLogin() -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="contrasena" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                <small>¿No tenés cuenta? <a th:href="@{/registro}">Crear una</a></small>
            </p>
            <p class="text-center mt-2 text-secondary">
                <small>Prueba: admin@fidelitas.ac.cr / jviquez@fidelitas.ac.cr / cmora@fidelitas.ac.cr — clave: 123456</small>
            </p>
        </div>
    </div>
</div>
</body>
</html>
