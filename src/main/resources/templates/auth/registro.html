<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta - TutorConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 480px; margin-top: 60px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3">Crear cuenta</h4>

            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form th:action="@{/registro}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="contrasena" class="form-control" minlength="6" required>
                    <div class="form-text">Mínimo 6 caracteres.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Me registro como</label>
                    <select name="rol" class="form-select" required>
                        <option value="ESTUDIANTE">Estudiante</option>
                        <option value="TUTOR">Tutor</option>
                    </select>
                </div>
                <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                <small>¿Ya tenés cuenta? <a th:href="@{/login}">Iniciar sesión</a></small>
            </p>
        </div>
    </div>
</div>
</body>
</html>
