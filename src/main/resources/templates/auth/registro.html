<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{registro.titulo}">Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="text-end p-2 container">
    <small class="text-secondary me-2" th:text="#{nav.idioma} + ':'">Idioma:</small>
    <a th:href="@{''(lang=es)}" class="me-2">Español</a>
    <a th:href="@{''(lang=en)}" class="me-2">English</a>
    <a th:href="@{''(lang=fr)}" class="me-2">Français</a>
    <a th:href="@{''(lang=pt)}">Português</a>
</div>

<div class="container" style="max-width: 480px; margin-top: 10px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-3" th:text="#{registro.titulo}">Crear cuenta</h4>

            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form th:action="@{/registro}" method="post">
                <div class="mb-3">
                    <label class="form-label" th:text="#{registro.nombre}">Nombre completo</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{login.correo}">Correo</label>
                    <input type="email" name="correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{login.contrasena}">Contraseña</label>
                    <input type="password" name="contrasena" class="form-control" minlength="6" required>
                    <div class="form-text" th:text="#{registro.contrasenaMinimo}">Mínimo 6 caracteres.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label" th:text="#{registro.rolPregunta}">Me registro como</label>
                    <select name="rol" class="form-select" required>
                        <option value="ESTUDIANTE" th:text="#{registro.rolEstudiante}">Estudiante</option>
                        <option value="TUTOR" th:text="#{registro.rolTutor}">Tutor</option>
                    </select>
                </div>
                <button class="btn btn-primary w-100" type="submit" th:text="#{registro.boton}">Crear cuenta</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                <small>
                    <span th:text="#{registro.yaTengoCuenta}">¿Ya tenés cuenta?</span>
                    <a th:href="@{/login}" th:text="#{login.titulo}">Iniciar sesión</a>
                </small>
            </p>
        </div>
    </div>
</div>
</body>
</html>
