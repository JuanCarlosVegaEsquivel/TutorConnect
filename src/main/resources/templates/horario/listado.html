<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{horario.listado}">Listado de Horarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{horario.listado}">Listado de Horarios</h1>
        <a th:href="@{/horarios/nuevo}" class="btn btn-primary" th:text="#{horario.nuevo}">Nuevo horario</a>
    </div>

    <div class="alert alert-primary mt-3" role="alert">
        <span th:text="#{horario.total}">Total de horarios</span>:
        <span th:text="${#lists.size(horarios)}"></span>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th th:text="#{horario.tutor}">Tutor</th>
                <th th:text="#{horario.dia}">Día</th>
                <th th:text="#{horario.horaInicio}">Hora de inicio</th>
                <th th:text="#{horario.horaFin}">Hora de fin</th>
                <th th:text="#{horario.activo}">Activo</th>
                <th th:text="#{horario.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="horario : ${horarios}">
                <td th:text="${horario.tutor.usuario.nombre}"></td>
                <td th:text="${horario.dia}"></td>
                <td th:text="${horario.horaInicio}"></td>
                <td th:text="${horario.horaFin}"></td>
                <td th:text="${horario.activo} ? #{texto.si} : #{texto.no}"></td>
                <td>
                    <a th:href="@{/horarios/editar/{id}(id=${horario.idHorario})}"
                       class="btn btn-sm btn-outline-primary" th:text="#{accion.editar}">Editar</a>
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/horarios/eliminar/{id}(id=${horario.idHorario})}"
                       class="btn btn-sm btn-outline-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{horario.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
