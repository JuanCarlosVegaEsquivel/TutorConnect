<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Horarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1>Listado de Horarios</h1>
        <a th:href="@{/horarios/nuevo}" class="btn btn-primary">
            Nuevo horario
        </a>
    </div>

    <div class="alert alert-primary mt-3" role="alert">
        Total de horarios:
        <span th:text="${#lists.size(horarios)}"></span>
    </div>

    <table class="table">

        <thead>
            <tr>
                <th>Tutor</th>
                <th>Día</th>
                <th>Hora de inicio</th>
                <th>Hora de fin</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="horario : ${horarios}">
                <td th:text="${horario.tutor.usuario.nombre}"></td>
                <td th:text="${horario.dia}"></td>
                <td th:text="${horario.horaInicio}"></td>
                <td th:text="${horario.horaFin}"></td>
                <td th:text="${horario.activo ? 'Sí' : 'No'}"></td>

                <td>
                    <a th:href="@{/horarios/editar/{id}(id=${horario.idHorario})}"
                       class="btn btn-sm btn-outline-primary">
                        Editar
                    </a>

                    <a th:href="@{/horarios/eliminar/{id}(id=${horario.idHorario})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Eliminar este horario?');">
                        Eliminar
                    </a>
                </td>
            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
