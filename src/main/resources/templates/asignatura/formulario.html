<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${asignatura.idAsignatura} != null ? #{asignatura.formTituloEditar} : #{asignatura.formTituloNuevo}">Formulario de Asignatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<div class="container-lg mt-4">
    <h1 th:text="${asignatura.idAsignatura} != null ? #{asignatura.formTituloEditar} : #{asignatura.formTituloNuevo}"></h1>
    <form th:action="@{/asignaturas/guardar}" th:object="${asignatura}" method="post">
        <input type="hidden" th:field="*{idAsignatura}"/>

        <div class="mb-3">
            <label for="nombre" class="form-label" th:text="#{asignatura.nombre}">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                   th:placeholder="#{asignatura.placeholderNombre}" required>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label" th:text="#{asignatura.descripcion}">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3" th:field="*{descripcion}"
                      th:placeholder="#{asignatura.placeholderDescripcion}"></textarea>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="activo" th:field="*{activo}">
            <label class="form-check-label" for="activo" th:text="#{asignatura.activo}">Activo</label>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
        <a th:href="@{/asignaturas}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
    </form>
</div>
</body>
</html>
