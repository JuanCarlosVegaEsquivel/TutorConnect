<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{asignatura.listado}">Listado de Asignaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{asignatura.listado}">Listado de Asignaturas</h1>
        <a th:href="@{/asignaturas/nuevo}" class="btn btn-primary" th:text="#{asignatura.nuevo}">Nueva asignatura</a>
    </div>

    <div class="alert alert-primary mt-3" role="alert">
        <span th:text="#{tutor.total}">Total</span>:
        <span th:text="${#lists.size(asignaturas)}"></span>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th th:text="#{asignatura.nombre}">Nombre</th>
                <th th:text="#{asignatura.descripcion}">Descripción</th>
                <th th:text="#{asignatura.activo}">Activo</th>
                <th th:text="#{asignatura.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="asignatura : ${asignaturas}">
                <td th:text="${asignatura.nombre}"></td>
                <td th:text="${asignatura.descripcion}"></td>
                <td th:text="${asignatura.activo} ? #{texto.si} : #{texto.no}"></td>
                <td>
                    <a th:href="@{/asignaturas/editar/{id}(id=${asignatura.idAsignatura})}"
                       class="btn btn-sm btn-outline-primary" th:text="#{accion.editar}">Editar</a>
                    <a th:href="@{/asignaturas/eliminar/{id}(id=${asignatura.idAsignatura})}"
                       class="btn btn-sm btn-outline-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{asignatura.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
