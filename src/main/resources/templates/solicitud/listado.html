<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Listado de Solicitudes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1>Listado de Solicitudes</h1>
        <a th:href="@{/solicitudes/nuevo}" class="btn btn-primary">Nueva solicitud</a>
    </div>

    <table class="table mt-3">

        <thead>
            <tr>
                <th>Estudiante</th>
                <th>Tutor</th>
                <th>Asignatura</th>
                <th>Horario</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="s : ${solicitudes}">
                <td th:text="${s.estudiante.usuario.nombre}"></td>
                <td th:text="${s.tutor.usuario.nombre}"></td>
                <td th:text="${s.asignatura.nombre}"></td>
                <td th:text="${s.horario.dia} + ' ' + ${s.horario.horaInicio} + ' - ' + ${s.horario.horaFin}"></td>
                <td>
                    <span class="badge bg-warning text-dark" th:if="${s.estado.name() == 'PENDIENTE'}">Pendiente</span>
                    <span class="badge bg-success" th:if="${s.estado.name() == 'APROBADA'}">Aprobada</span>
                    <span class="badge bg-danger" th:if="${s.estado.name() == 'RECHAZADA'}">Rechazada</span>
                    <span class="badge bg-secondary" th:if="${s.estado.name() == 'CANCELADA'}">Cancelada</span>
                </td>
                <td>
                    <a sec:authorize="hasAnyRole('TUTOR','ADMIN')"
                       th:if="${s.estado.name() == 'PENDIENTE'}"
                       th:href="@{/solicitudes/aprobar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-success">Aprobar</a>
                    <a sec:authorize="hasAnyRole('TUTOR','ADMIN')"
                       th:if="${s.estado.name() == 'PENDIENTE'}"
                       th:href="@{/solicitudes/rechazar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-warning">Rechazar</a>
                    <a sec:authorize="hasRole('ESTUDIANTE')"
                       th:if="${s.estado.name() == 'PENDIENTE'}"
                       th:href="@{/solicitudes/cancelar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-warning"
                       onclick="return confirm('¿Cancelar esta solicitud?');">Cancelar</a>
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/solicitudes/eliminar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Eliminar esta solicitud?');">Eliminar</a>
                </td>
            </tr>
        </tbody>

    </table>

</div>

</body>
</html>
