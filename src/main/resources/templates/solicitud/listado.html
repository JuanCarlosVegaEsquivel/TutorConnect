<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{solicitud.listado}">Listado de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{solicitud.listado}">Listado de Solicitudes</h1>
        <a sec:authorize="hasAnyRole('ESTUDIANTE','ADMIN')" th:href="@{/solicitudes/nuevo}" class="btn btn-primary" th:text="#{solicitud.nuevo}">Nueva solicitud</a>
    </div>

    <table class="table mt-3">
        <thead>
            <tr>
                <th th:text="#{solicitud.estudiante}">Estudiante</th>
                <th th:text="#{solicitud.tutor}">Tutor</th>
                <th th:text="#{solicitud.asignatura}">Asignatura</th>
                <th th:text="#{solicitud.horario}">Horario</th>
                <th th:text="#{solicitud.estado}">Estado</th>
                <th th:text="#{solicitud.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${solicitudes}">
                <td th:text="${s.estudiante.usuario.nombre}"></td>
                <td th:text="${s.tutor.usuario.nombre}"></td>
                <td th:text="${s.asignatura.nombre}"></td>
                <td th:text="${s.horario.dia} + ' ' + ${s.horario.horaInicio} + ' - ' + ${s.horario.horaFin}"></td>
                <td>
                    <span class="badge bg-warning text-dark" th:if="${s.estado.name() == 'PENDIENTE'}" th:text="#{estado.pendiente}">Pendiente</span>
                    <span class="badge bg-success" th:if="${s.estado.name() == 'APROBADA'}" th:text="#{estado.aprobada}">Aprobada</span>
                    <span class="badge bg-danger" th:if="${s.estado.name() == 'RECHAZADA'}" th:text="#{estado.rechazada}">Rechazada</span>
                    <span class="badge bg-secondary" th:if="${s.estado.name() == 'CANCELADA'}" th:text="#{estado.cancelada}">Cancelada</span>
                </td>
                <td>
                    <a sec:authorize="hasAnyRole('TUTOR','ADMIN')"
                       th:if="${s.estado.name() == 'PENDIENTE'}"
                       th:href="@{/solicitudes/aprobar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-success" th:text="#{solicitud.aprobar}">Aprobar</a>
                    <a sec:authorize="hasAnyRole('TUTOR','ADMIN')"
                       th:if="${s.estado.name() == 'PENDIENTE'}"
                       th:href="@{/solicitudes/rechazar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-warning" th:text="#{solicitud.rechazar}">Rechazar</a>
                    <a sec:authorize="hasRole('ESTUDIANTE')"
                       th:if="${s.estado.name() == 'PENDIENTE'}"
                       th:href="@{/solicitudes/cancelar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-warning"
                       th:text="#{solicitud.cancelar}"
                       th:onclick="'return confirm(\'' + #{solicitud.confirmarCancelar} + '\');'">Cancelar</a>
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/solicitudes/eliminar/{id}(id=${s.idSolicitud})}"
                       class="btn btn-sm btn-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{solicitud.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
