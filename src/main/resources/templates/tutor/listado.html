<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{tutor.listado}">Listado de Tutores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
    <span class="navbar-brand" th:text="#{app.nombre}">TutorConnect</span>
    <div class="d-flex align-items-center">
        <a th:href="@{/inicio}" class="btn btn-sm btn-outline-light me-2" th:text="#{nav.volverInicio}">Volver al inicio</a>
        <form th:action="@{/logout}" method="post" class="d-flex mb-0">
            <button class="btn btn-sm btn-outline-light" type="submit" th:text="#{nav.salir}">Salir</button>
        </form>
    </div>
</nav>

<div class="container-lg mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1 th:text="#{tutor.listado}">Listado de Tutores</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/tutores/nuevo}" class="btn btn-primary" th:text="#{tutor.nuevo}">Nuevo tutor</a>
    </div>

    <div class="alert alert-primary" role="alert">
        <span th:text="#{tutor.total}">Total de tutores</span>:
        <span th:text="${totalTutores}"></span>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th th:text="#{tutor.nombre}">Nombre</th>
                <th th:text="#{tutor.correo}">Correo</th>
                <th th:text="#{tutor.biografia}">Biografía</th>
                <th th:text="#{tutor.materias}">Materias</th>
                <th th:text="#{tutor.activo}">Activo</th>
                <th sec:authorize="hasRole('ADMIN')" th:text="#{tutor.acciones}">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tutor : ${tutores}">
                <td th:text="${tutor.usuario.nombre}"></td>
                <td th:text="${tutor.usuario.correo}"></td>
                <td th:text="${tutor.biografia}"></td>
                <td>
                    <span class="badge bg-secondary me-1"
                          th:each="asignatura : ${tutor.asignaturas}"
                          th:text="${asignatura.nombre}"></span>
                </td>
                <td th:text="${tutor.activo} ? #{texto.si} : #{texto.no}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/tutores/editar/{id}(id=${tutor.idUsuario})}" class="btn btn-sm btn-outline-primary" th:text="#{accion.editar}">Editar</a>
                    <a th:href="@{/tutores/eliminar/{id}(id=${tutor.idUsuario})}" class="btn btn-sm btn-outline-danger"
                       th:text="#{accion.eliminar}"
                       th:onclick="'return confirm(\'' + #{tutor.confirmarEliminar} + '\');'">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
